
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4


      - name: Preparar ambiente Godot
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"

          cp -a /root/.config/godot/. "$HOME/.config/godot/"

          cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"

          
      - name: Instalar ferramentas Android
        shell: bash
        run: |
          yes | sdkmanager --sdk_root=/usr/lib/android-sdk --licenses || true

          sdkmanager --sdk_root=/usr/lib/android-sdk \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      
      - name: Gerar APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --path . \
            --export-debug "Android" \
            build/Ilha-dos-Desesperados.apk 2>&1 | tee build/export.log

      - name: Salvar log de exportacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-exportacao
          path: build/export.log
          if-no-files-found: ignore


      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilha-dos-Desesperados-Android
          path: build/Ilha-dos-Desesperados.apk
          if-no-files-found: error
          retention-days: 14
