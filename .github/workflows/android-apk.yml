
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar ambiente Godot
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"

          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"

          echo "Verificando configuracoes:"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"
          ls "$HOME/.local/share/godot/export_templates/4.3.stable"

      - name: Verificar ferramentas
        run: |
          java -version
          ls /usr/lib/android-sdk/build-tools/33.0.2
          ls /usr/lib/android-sdk/platforms/android-33

      - name: Gerar APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Ilha-dos-Desesperados.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilha-dos-Desesperados-Android
          path: build/Ilha-dos-Desesperados.apk
          if-no-files-found: error
          retention-days: 14
