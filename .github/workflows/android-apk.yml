
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar ambiente
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"

          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> "$SETTINGS"
          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> "$SETTINGS"
          echo 'export/android/debug_keystore = "/root/debug.keystore"' >> "$SETTINGS"
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$SETTINGS"
          echo 'export/android/debug_keystore_pass = "android"' >> "$SETTINGS"

      
      - name: Instalar ferramentas Android
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --sdk_root=/usr/lib/android-sdk --licenses
          sdkmanager --sdk_root=/usr/lib/android-sdk \
            "platform-tools" \
            "build-tools;33.0.2" \
            "platforms;android-33" \
            "cmdline-tools;latest" \
            "cmake;3.22.1" \
            "ndk;25.2.9519653"


      - name: Gerar APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Ilha-dos-Desesperados.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilha-dos-Desesperados-Android
          path: build/Ilha-dos-Desesperados.apk
          if-no-files-found: error
          retention-days: 14
