
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar ambiente Godot
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"

      
      - name: Diagnosticar Android
        shell: bash
        run: |
          echo "=== Build Tools version ==="
          cat /usr/lib/android-sdk/build-tools/33.0.2/source.properties

          echo "=== Android SDK variables ==="
          env | grep -E 'ANDROID|JAVA_HOME' || true

          echo "=== Godot Android settings ==="
          grep -in 'android' "$HOME/.config/godot/editor_settings-4.3.tres" || true

          echo "=== SDK platforms ==="
          ls -la /usr/lib/android-sdk/platforms/

          echo "=== Build Tools files ==="
          ls -la /usr/lib/android-sdk/build-tools/33.0.2/

      - name: Gerar APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Ilha-dos-Desesperados.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilha-dos-Desesperados-Android
          path: build/Ilha-dos-Desesperados.apk
          if-no-files-found: error
          retention-days: 14
