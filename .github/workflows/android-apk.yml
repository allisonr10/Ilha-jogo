name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar arquivos
        run: |
          mkdir -p scenes scripts build
          cp main.tscn scenes/main.tscn
          cp main.gd scripts/main.gd

      - name: Gerar APK
        run: godot --headless --path . --export-debug "Android" build/Ilha-dos-Desesperados.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilha-dos-Desesperados-Android
          path: build/Ilha-dos-Desesperados.apk
          if-no-files-found: error
          retention-days: 14
